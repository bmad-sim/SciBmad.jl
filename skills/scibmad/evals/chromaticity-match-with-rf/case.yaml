schema_version: "1.1"
name: chromaticity-match-with-rf
expected_outcome: |
  A script that matches the chromaticities with the RF cavity turned off for the chromatic
  calculation (rf_on=false), runs, and reports sf.Kn2 = 24.857, sd.Kn2 = -28.033, chromaticities
