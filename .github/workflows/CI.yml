name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1'
          - 'lts'
        os:
          - ubuntu-latest
        arch:
          - x64
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write # needed to comment the preview link on the PR
      statuses: write
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - name: Configure doc environment
        shell: julia --project=docs --color=yes {0}
        run: |
          using Pkg
          Pkg.develop(PackageSpec(path=pwd()))
          Pkg.instantiate()
      - uses: julia-actions/julia-buildpkg@v1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Install Sphinx dependencies
        run: pip install -r docs/requirements.txt
      - name: Precompile docs environment
        # Every runnable page is executed by its own fresh IJulia kernel whose
        # first cell is `using SciBmad`. Precompile the environment once here,
        # where a failure is immediate and says what broke, instead of leaving
        # each of those kernels to discover it and spend a 600 s
        # `nb_execution_timeout` finding out -- ten pages of that is a two-hour
        # red build whose log says only that a cell timed out. The depot is not
        # cached between runs: a restored depot was compiled on another runner's
        # CPU, and the pages then printed its warnings and recompiled. Loading
        # every package the pages use also compiles their extensions here.
        shell: julia --project=docs --color=yes {0}
        run: |
          using Pkg
          Pkg.precompile()
          @time using SciBmad, NonlinearSolve, Statistics
      - name: Clear locks left by the precompile
        # A precompile process that dies leaves a `.ji.pidfile` behind in the
        # depot, and loading a package whose lock is held blocks until the lock
        # is declared stale: ten minutes per page (the two-hour build in PR #119
        # came from a process dying during the precompile step above).
        run: find ~/.julia/compiled -name '*.pidfile' -print -delete || true
      - name: Build documentation
        run: python docs/build.py
      - name: Deploy PR preview
        if: github.event_name == 'pull_request'
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./gh-pages
      - name: Deploy documentation
        uses: JamesIves/github-pages-deploy-action@v4
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        with:
          folder: ./gh-pages
          clean-exclude: pr-preview/ # keep live previews for still-open PRs
          force: false # retry instead of clobbering a concurrent preview deploy
      - name: Run doctests
        shell: julia --project=docs --color=yes {0}
        run: |
          using Documenter: DocMeta, doctest
          using SciBmad
          DocMeta.setdocmeta!(SciBmad, :DocTestSetup, :(using SciBmad); recursive=true)
          doctest(SciBmad)
